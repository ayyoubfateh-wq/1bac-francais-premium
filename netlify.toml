[build]
  # Seul dist/ est publié : le contenu premium (private/content.json)
  # n'existe QUE dans le bundle de la fonction /api/content.
  publish = "dist"
  functions = "netlify/functions"
  # Build : valide tout le contenu PUIS assemble le site public dans dist/
  # (garde anti-fuite incluse). Si quoi que ce soit est cassé, le
  # déploiement échoue et le site en ligne reste intact.
  command = "npm run build"

[functions]
  node_bundler = "esbuild"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[redirects]]
  from = "/api/validate-access"
  to = "/.netlify/functions/validate-access"
  status = 200

[[redirects]]
  from = "/api/leaderboard"
  to = "/.netlify/functions/leaderboard"
  status = 200

[[redirects]]
  from = "/api/progress"
  to = "/.netlify/functions/progress"
  status = 200

[[redirects]]
  from = "/api/admin"
  to = "/.netlify/functions/admin"
  status = 200

[[redirects]]
  from = "/api/stats"
  to = "/.netlify/functions/stats"
  status = 200

[[redirects]]
  from = "/api/content"
  to = "/.netlify/functions/content"
  status = 200
